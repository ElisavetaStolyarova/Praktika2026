services:
  backend:
    build: ./backend
    container_name: gallery-backend
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: gallery-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
